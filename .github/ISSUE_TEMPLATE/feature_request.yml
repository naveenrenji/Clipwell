name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: markdown
    attributes:
      value: Clipwell stays local-only, so cloud sync and telemetry requests will be declined. See the [roadmap](https://github.com/naveenrenji/Clipwell/blob/main/ROADMAP.md).
